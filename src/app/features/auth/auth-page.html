<section class="bg-surface-alt flex min-h-screen items-center justify-center px-4 pt-24 pb-16">
  <div
    class="bg-surface w-full max-w-md rounded-[28px] p-6 shadow-[0_30px_80px_-30px_rgba(0,0,0,0.25)] sm:p-10"
  >
    <p class="text-fg-muted text-xs font-semibold tracking-wide uppercase">B2B Shop</p>
    <h1 class="mt-1 text-[1.75rem] leading-tight font-semibold tracking-tight">
      {{ mode() === 'register' ? 'Запрос на регистрацию' : 'Вход' }}
    </h1>

    <div class="bg-surface-alt mt-6 grid grid-cols-2 gap-1 rounded-full p-1" role="tablist">
      <a
        routerLink="/auth/login"
        role="tab"
        [attr.aria-selected]="mode() === 'login'"
        class="rounded-full px-3 py-2 text-center text-xs font-medium transition-colors"
        [class]="
          mode() === 'login' ? 'bg-surface text-fg shadow-sm' : 'text-fg-muted hover:text-fg'
        "
        >Вход</a
      >
      <a
        routerLink="/auth/register"
        role="tab"
        [attr.aria-selected]="mode() === 'register'"
        class="rounded-full px-3 py-2 text-center text-xs font-medium transition-colors"
        [class]="
          mode() === 'register' ? 'bg-surface text-fg shadow-sm' : 'text-fg-muted hover:text-fg'
        "
        >Запрос на регистрацию</a
      >
    </div>

    @if (mode() === 'login') {
      <form [formGroup]="loginForm" (ngSubmit)="submit()" class="mt-6 space-y-3" novalidate>
        <label class="relative block">
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder=" "
            [class]="field + ' h-14'"
            [attr.aria-invalid]="invalid(loginForm.controls.email)"
          />
          <span [class]="label">Email</span>
        </label>
        <label class="relative block">
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder=" "
            [class]="field + ' h-14'"
            [attr.aria-invalid]="invalid(loginForm.controls.password)"
          />
          <span [class]="label">Пароль</span>
        </label>
        @if (error()) {
          <p role="alert" class="text-danger px-1 text-sm">{{ error() }}</p>
        }
        <button type="submit" [disabled]="busy()" [class]="submitButton">Войти</button>
      </form>
    } @else {
      <form [formGroup]="registerForm" (ngSubmit)="submit()" class="mt-6 space-y-3" novalidate>
        <label class="relative block">
          <input
            type="text"
            formControlName="company"
            autocomplete="organization"
            placeholder=" "
            [class]="field + ' h-14'"
            [attr.aria-invalid]="invalid(registerForm.controls.company)"
          />
          <span [class]="label">Название компании</span>
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="relative block">
            <input
              type="text"
              formControlName="firstName"
              autocomplete="given-name"
              placeholder=" "
              [class]="field + ' h-14'"
              [attr.aria-invalid]="invalid(registerForm.controls.firstName)"
            />
            <span [class]="label">Имя</span>
          </label>
          <label class="relative block">
            <input
              type="text"
              formControlName="lastName"
              autocomplete="family-name"
              placeholder=" "
              [class]="field + ' h-14'"
              [attr.aria-invalid]="invalid(registerForm.controls.lastName)"
            />
            <span [class]="label">Фамилия</span>
          </label>
        </div>
        <label class="relative block">
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder=" "
            [class]="field + ' h-14'"
            [attr.aria-invalid]="invalid(registerForm.controls.email)"
          />
          <span [class]="label">Email</span>
        </label>
        <label class="relative block">
          <input
            type="tel"
            formControlName="phone"
            autocomplete="tel"
            placeholder="+7 (___) ___-__-__"
            [class]="field + ' h-14'"
            [attr.aria-invalid]="invalid(registerForm.controls.phone)"
          />
          <span [class]="label">Номер телефона</span>
        </label>
        @if (error()) {
          <p role="alert" class="text-danger px-1 text-sm">{{ error() }}</p>
        }
        <button type="submit" [disabled]="busy()" [class]="submitButton">Отправить запрос</button>
      </form>
    }
  </div>
</section>
